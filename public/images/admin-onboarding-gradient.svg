<svg preserveAspectRatio="none" overflow="visible" style="display: block;" width="100%" height="100%" viewBox="0 0 800 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="900" fill="url(#bg_grad)"/>
  <!-- Large blurred circle top-right -->
  <g filter="url(#blur1)">
    <circle cx="620" cy="200" r="280" fill="url(#c1)"/>
  </g>
  <!-- Second blurred circle bottom-left -->
  <g filter="url(#blur2)">
    <circle cx="160" cy="700" r="220" fill="url(#c2)"/>
  </g>
  <!-- Subtle orbit rings -->
  <circle cx="620" cy="200" r="320" stroke="white" stroke-opacity="0.08" stroke-width="1" fill="none"/>
  <circle cx="620" cy="200" r="380" stroke="white" stroke-opacity="0.05" stroke-width="1" fill="none"/>
  <circle cx="620" cy="200" r="440" stroke="white" stroke-opacity="0.03" stroke-width="1" fill="none"/>
  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DDDEFC"/>
      <stop offset="0.5" stop-color="#EEF0FD"/>
      <stop offset="1" stop-color="#E7F8F2"/>
    </linearGradient>
    <filter id="blur1" x="200" y="-80" width="840" height="840" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <filter id="blur2" x="-100" y="380" width="680" height="680" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <linearGradient id="c1" x1="340" y1="-80" x2="900" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c7cafc"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="c2" x1="-60" y1="480" x2="380" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#bbf7d0"/>
      <stop offset="1" stop-color="#6ee7b7"/>
    </linearGradient>
  </defs>
</svg>
